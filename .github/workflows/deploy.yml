name: Deploy Event Planner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Event Planner
        uses: actions/upload-pages-artifact@v4
        with:
          path: dance-party-app/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
